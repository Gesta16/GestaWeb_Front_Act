<app-header></app-header>

<div class="flex min-h-screen justify-center items-center px-4">
  <div class="flex flex-col items-center w-full sm:w-3/4 lg:w-1/2 px-4 ml-56 mt-24" [ngClass]="{
        'ml-56': isExpanded && isVisible,
        'ml-20': !isExpanded && isVisible,
        'ml-0': !isVisible
    }">
    <div class="bg-white rounded-lg shadow-lg p-6 w-full mb-4">

      <!-- Título -->
      <div class="border border-[#80ba27] px-6 py-4 flex items-center space-x-3 hover:bg-[#F5F6DB]">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-sliders-horizontal">
          <line x1="21" x2="14" y1="4" y2="4" />
          <line x1="10" x2="3" y1="4" y2="4" />
          <line x1="21" x2="12" y1="12" y2="12" />
          <line x1="8" x2="3" y1="12" y2="12" />
          <line x1="21" x2="16" y1="20" y2="20" />
          <line x1="12" x2="3" y1="20" y2="20" />
          <line x1="14" x2="14" y1="2" y2="6" />
          <line x1="8" x2="8" y1="10" y2="14" />
          <line x1="16" x2="16" y1="18" y2="22" />
        </svg>
        <h2 class="text-lg font-bold">Generar Reporte Dinámico</h2>
      </div>

      <!-- Contenido principal -->
      <div class="p-6 space-y-6">
        <!-- Selección de tablas -->
        <div class="flex flex-col text-xs">
          <label class="flex items-center space-x-2 text-sm font-medium mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-database">
              <ellipse cx="12" cy="5" rx="9" ry="3" />
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
            </svg>
            <span>Seleccionar Tablas (Categorías)</span>
          </label>

          <!-- Lista de checkboxes para tablas -->
          <div class="space-y-2">
            <div *ngFor="let tabla of tablasDisponibles" class="flex items-center space-x-2">
              <input type="checkbox" [id]="'tabla_' + tabla.key" [value]="tabla.key"
                (change)="toggleTablaSeleccionada(tabla.key, $event)"
                class="h-4 w-4 text-[#80ba27] focus:ring-[#80ba27]">
              <label [for]="'tabla_' + tabla.key" class="text-sm">
                {{ tabla.nombre }}
              </label>
            </div>
          </div>
        </div>

        <!-- Campos por tabla -->
        <div *ngFor="let tablaKey of filtros.tablasSeleccionadas" class="mb-6">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-[#80ba27]">{{ obtenerNombreTabla(tablaKey) }}</h3>
            <div class="space-x-2">
              <button (click)="seleccionarTodosCampos(tablaKey)"
                      class="text-xs px-2 py-1 bg-[#80ba27] text-white rounded hover:bg-[#6da123]">
                Seleccionar todo
              </button>
              <button (click)="deseleccionarTodosCampos(tablaKey)"
                      class="text-xs px-2 py-1 bg-gray-500 text-white rounded hover:bg-gray-600">
                Desmarcar todo
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Columna Izquierda -->
            <div class="space-y-2">
              <div *ngFor="let campo of camposPorTabla[tablaKey] | slice:0:(camposPorTabla[tablaKey]?.length / 2)">
                <label class="flex items-center space-x-2">
                  <input type="checkbox" [value]="tablaKey + '.' + campo"
                    [checked]="filtros.camposSeleccionados.includes(tablaKey + '.' + campo)"
                    (change)="actualizarSeleccion($event, tablaKey + '.' + campo)"
                    class="h-4 w-4 text-[#80ba27] focus:ring-[#80ba27]">
                  <span class="text-sm">{{ campo | titlecase }}</span>
                </label>
              </div>
            </div>

            <!-- Columna Derecha -->
            <div class="space-y-2">
              <div *ngFor="let campo of camposPorTabla[tablaKey] | slice:(camposPorTabla[tablaKey]?.length / 2)">
                <label class="flex items-center space-x-2">
                  <input type="checkbox" [value]="tablaKey + '.' + campo"
                    [checked]="filtros.camposSeleccionados.includes(tablaKey + '.' + campo)"
                    (change)="actualizarSeleccion($event, tablaKey + '.' + campo)"
                    class="h-4 w-4 text-[#80ba27] focus:ring-[#80ba27]">
                  <span class="text-sm">{{ campo | titlecase }}</span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <!-- Fechas -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="flex flex-col text-xs">
            <label class="flex items-center space-x-2 text-sm font-medium mb-3">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-calendar-range">
                <rect width="18" height="18" x="3" y="4" rx="2" />
                <path d="M16 2v4" />
                <path d="M3 10h18" />
                <path d="M8 2v4" />
                <path d="M17 14h-6" />
                <path d="M13 18H7" />
                <path d="M7 14h.01" />
                <path d="M17 18h.01" />
              </svg>
              <span>Fecha de inicio</span>
            </label>
            <input type="date" class="p-2 border border-gray-300 rounded-md focus:outline-none focus:border-[#00acc9]"
              [(ngModel)]="filtros.fecha_inicio">
          </div>
          <div class="flex flex-col text-xs">
            <label class="flex items-center space-x-2 text-sm font-medium mb-3">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-calendar-range">
                <rect width="18" height="18" x="3" y="4" rx="2" />
                <path d="M16 2v4" />
                <path d="M3 10h18" />
                <path d="M8 2v4" />
                <path d="M17 14h-6" />
                <path d="M13 18H7" />
                <path d="M7 14h.01" />
                <path d="M17 18h.01" />
              </svg>
              <span>Fecha de fin</span>
            </label>
            <input type="date" class="p-2 border border-gray-300 rounded-md focus:outline-none focus:border-[#00acc9]"
              [(ngModel)]="filtros.fecha_fin">
          </div>
        </div>

        <!-- Botones de acción -->
        <div class="flex justify-end space-x-3 mt-8">
          <button class="px-4 py-2 bg-[#80ba27] text-white rounded-md hover:bg-[#6da123] transition-colors"
            (click)="aplicarFiltros('excel')">
            Generar Excel
          </button>
          <button class="px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600 transition-colors"
            (click)="aplicarFiltros('pdf')">
            Generar PDF
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
