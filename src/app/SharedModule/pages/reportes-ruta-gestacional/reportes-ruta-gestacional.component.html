<div class="max-w-4xl mx-auto bg-white shadow-md rounded-lg p-6">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Reporte de Categorías</h2>
  
    <form class="space-y-6">
      <!-- Selección de Categoría -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="categoria" class="block text-sm font-medium text-gray-600">Categoría</label>
          <select
            id="categoria"
            [(ngModel)]="categoriaSeleccionada"
            name="categoria"
            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
            (change)="onCategoriaChange()"
          >
            <option *ngFor="let categoria of categorias" [ngValue]="categoria">
              {{ categoria.nombre }}
            </option>
          </select>
        </div>
  
        <!-- Selección de Subcategoría (Si aplica) -->
        <div *ngIf="categoriaSeleccionada?.subcategorias">
          <label for="subcategoria" class="block text-sm font-medium text-gray-600">Subcategoría</label>
          <select
            id="subcategoria"
            [(ngModel)]="subcategoriaSeleccionada"
            name="subcategoria"
            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500"
          >
            <option *ngFor="let subcategoria of categoriaSeleccionada.subcategorias" [ngValue]="subcategoria">
              {{ subcategoria.nombre }}
            </option>
          </select>
        </div>
      </div>
  
      <!-- Botón de Aplicar Filtros -->
      <div class="flex justify-end">
        <button
          type="button"
          class="px-6 py-2 bg-indigo-600 text-white font-medium text-sm rounded-lg hover:bg-indigo-700 focus:outline-none"
          (click)="aplicarFiltros()"
        >
          Aplicar Filtros
        </button>
      </div>
    </form>
  
    
    <!-- Mensajes de Error -->
    <div *ngIf="error" class="text-red-600 mt-4">
      {{ error }}
    </div>
  </div>
