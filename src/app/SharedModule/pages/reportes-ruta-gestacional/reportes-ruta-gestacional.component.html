<!-- Encabezado -->
<app-header></app-header>

<div class="mx-auto px-4 mt-[8rem] max-w-[95%] transition-all duration-300" 
     [ngClass]="{ 'ml-56': isExpanded && isVisible, 'ml-20': !isExpanded && isVisible, 'ml-0': !isVisible }">
    <!-- Contenedor Principal con Bordes Visibles -->
    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-lg p-6 border-2 border-gray-200">
        <!-- Título con Icono -->
        <div class="flex items-center mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" 
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
                 class="lucide lucide-chart-line text-indigo-600 mr-2">
                <path d="M3 3v16a2 2 0 0 0 2 2h16" />
                <path d="m19 9-5 5-4-4-3 3" />
            </svg>
            <h2 class="text-xl font-semibold text-gray-700">Reporte de ruta gestante</h2>
        </div>

        <!-- Formulario de Filtros -->
        <form class="space-y-6">
            <!-- Selección de Categoría -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="categoria" class="block text-sm font-medium text-gray-600 mb-1">
                        Categoría
                    </label>
                    <div class="relative">
                        <select id="categoria" [(ngModel)]="categoriaSeleccionada" name="categoria"
                                class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg shadow-sm 
                                       focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all
                                       appearance-none bg-white">
                            <option *ngFor="let categoria of categorias" [ngValue]="categoria">
                                {{ categoria.nombre }}
                            </option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" 
                                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" 
                                 stroke-linejoin="round" class="lucide lucide-chevron-down text-gray-400">
                                <path d="m6 9 6 6 6-6" />
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Selección de Subcategoría (Si aplica) -->
                <div *ngIf="categoriaSeleccionada?.subcategorias">
                    <label for="subcategoria" class="block text-sm font-medium text-gray-600 mb-1">
                        Subcategoría
                    </label>
                    <div class="relative">
                        <select id="subcategoria" [(ngModel)]="subcategoriaSeleccionada" name="subcategoria"
                                class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg shadow-sm 
                                       focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all
                                       appearance-none bg-white">
                            <option *ngFor="let subcategoria of categoriaSeleccionada.subcategorias" 
                                    [ngValue]="subcategoria">
                                {{ subcategoria.nombre }}
                            </option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" 
                                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" 
                                 stroke-linejoin="round" class="lucide lucide-chevron-down text-gray-400">
                                <path d="m6 9 6 6 6-6" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Botón de Aplicar Filtros -->
            <div class="flex justify-end space-x-4 mt-4">
                <!-- Botón de Aplicar Filtros -->
                <button
                  type="button"
                  (click)="aplicarFiltros()"
                  class="flex items-center px-6 py-2 bg-indigo-600 text-white font-medium text-sm rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-filter mr-2"
                  >
                    <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z" />
                  </svg>
                  Aplicar Filtros
                </button>
              
                <!-- Botón de Generar Reporte Unificado -->
                <button
                  (click)="generarReporteUnificado()"
                  class="flex items-center px-6 py-2 bg-blue-500 text-white font-medium text-sm rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-file-text mr-2"
                  >
                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="16" y1="13" x2="8" y2="13" />
                    <line x1="16" y1="17" x2="8" y2="17" />
                    <line x1="10" y1="9" x2="8" y2="9" />
                  </svg>
                  Generar Reporte Unificado
                </button>
              </div>
        </form>

        
    </div>
</div>
