<div class="fixed inset-0 flex items-center justify-center bg-gray-900 bg-opacity-50">
    <div class="bg-white rounded-lg shadow-lg w-[90%] md:w-[70%] lg:w-[45%] p-6">
        <h2 class="text-xl font-bold mb-4 text-center titulo">
            Creación de alertas
        </h2>

        <form (ngSubmit)="createSignoAlarma(alertaForm)" #alertaForm="ngForm">
            <div class="grid grid-cols-2 gap-4">
                <!-- Título -->
                <div class="mb-4">
                    <label for="" class="block text-sm font-medium text-gray-700">Título</label>
                    <input type="text" id="nombre" name="nombre" [(ngModel)]="signosAlarma.nombre" #nombreCtrl="ngModel"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        [ngClass]="{'border-red-400': nombreCtrl.invalid && nombreCtrl.touched, 'border-gray-300': nombreCtrl.valid || !nombreCtrl.touched}"
                        required>
                </div>

                <!-- Descripción -->
                <div class="mb-4">
                    <label for="" class="block text-sm font-medium text-gray-700">Descripción</label>
                    <input type="text" id="descripcion" name="descripcion" [(ngModel)]="signosAlarma.descripcion" #descripcionCtrl="ngModel"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        [ngClass]="{'border-red-400': descripcionCtrl.invalid && descripcionCtrl.touched, 'border-gray-300': descripcionCtrl.valid || !descripcionCtrl.touched}"
                        required>
                </div>

                <!-- Documento -->
                <div class="mb-4">
                    <label for="" class="block text-sm font-medium text-gray-700">Documento</label>
                    <input type="text" id="documento" name="documento" [(ngModel)]="signosAlarma.documento" #documentoCtrl="ngModel"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500"
                        [ngClass]="{'border-red-400':  documentoCtrl.invalid && documentoCtrl.touched, 'border-gray-300': documentoCtrl.valid || !documentoCtrl.touched}"
                        required>
                </div>
            </div>
            <!-- Botones -->
            <div class="flex justify-end mt-6">
                <button type="button" (click)="cerrar(false)"
                    class="bg-[#80BA27] hover:bg-[#7cb02d] text-white font-bold py-2 px-4 rounded mr-2">Cancelar
                </button>
                <button type="submit"
                    class="bg-[#00ACC9] hover:bg-[#0194ad] text-white font-bold py-2 px-4 rounded">Guardar
                </button>
            </div>  
            
        </form>        
    </div>
</div>
