<!-- Encabezado -->
<app-header></app-header>

<!-- Main Content Container -->
<div class="mx-auto px-4 mt-[8rem] max-w-[95%] transition-all duration-300"
    [ngClass]="{ 'ml-56': isExpanded && isVisible, 'ml-20': !isExpanded && isVisible, 'ml-0': !isVisible}">

    <!-- Page Header -->
    <div class="text-center mb-12">
        <h1 class="text-3xl font-bold text-gray-800 mb-4">Recursos de Salud</h1>
        <p class="text-gray-600 max-w-2xl mx-auto">Encuentra información valiosa sobre salud maternal, cuidado infantil
            y más</p>
    </div>

    <div class="container mx-auto px-4 py-8">
        <!-- Animated Search Bar -->
        <div class="max-w-xl mx-auto mb-12">
            <div class="relative">
                <input type="text" placeholder="Buscar recursos..."
                    class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-[#3eb6c6] focus:border-transparent transition-all duration-300 shadow-sm"
                    [(ngModel)]="searchTerm" (input)="updateFilters()">
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
        </div>

        <!-- Resources Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
            <!-- Resource Card Template -->
            <div *ngFor="let item of filteredResources"
                class="group bg-white rounded-xl shadow-md hover:shadow-xl transition-all duration-300 overflow-hidden transform hover:-translate-y-1">
                <div class="p-6">
                    <!-- Icon Container -->
                    <div
                        class="w-16 h-16 mx-auto mb-6 bg-[#3eb6c6] rounded-full flex items-center justify-center transform group-hover:scale-110 transition-transform duration-300">
                        <div class="icon-container" [innerHTML]="item.icon | safeHtml"></div>
                    </div>

                    <!-- Title -->
                    <a [href]="item.link" target="_blank"
                        class="block font-semibold text-gray-800 hover:text-[#3eb6c6] transition-colors duration-300 text-center">
                        {{ item.title }}
                    </a>

                    <!-- Hover Effect Line -->
                    <div class="w-0 h-0.5 bg-[#3eb6c6] mx-auto mt-4 group-hover:w-1/2 transition-all duration-300">
                    </div>
                </div>
            </div>
        </div>

        <!-- Category Filters -->
        <div class="flex flex-wrap justify-center gap-4 mt-12">
            <button *ngFor="let category of categories"
                class="px-4 py-2 rounded-full text-sm font-medium transition-all duration-300" [ngClass]="{'bg-[#3eb6c6] text-white': selectedCategory === category,
                               'bg-gray-100 text-gray-700 hover:bg-gray-200': selectedCategory !== category}"
                (click)="filterByCategory(category)">
                {{ category }}
            </button>
        </div>
    </div>
</div>
