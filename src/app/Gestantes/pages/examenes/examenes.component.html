<app-header></app-header>

<!-- Container principal con padding responsivo -->
<div class="mx-auto px-4 sm:px-6 lg:px-8 mt-16 sm:mt-20 lg:mt-24 w-full max-w-7xl transition-all duration-300" 
    [ngClass]="{ 
      'ml-56': isExpanded && isVisible, 
      'ml-20': !isExpanded && isVisible, 
      'ml-0': !isVisible
    }">

    <!-- Card principal -->
    <div class="bg-white p-4 sm:p-6 rounded-lg shadow-lg mb-6">
        <h2 class="text-lg sm:text-xl lg:text-2xl font-bold mb-4 text-gray-800">Exámenes de los Trimestres</h2>

        <!-- Contenedor de la grid -->
        <div class="space-y-4">
            <!-- Marco exterior -->
            <div class="w-full p-3 sm:p-4 border border-slate-400 rounded-lg">
                <!-- Grid responsiva de trimestres -->
                <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 sm:gap-4">
                    
                    <!-- Primer Trimestre -->
                    <div class="border border-slate-300 rounded-lg p-3 sm:p-4 hover:shadow-md transition-shadow">
                        <h3 class="text-base sm:text-lg lg:text-xl font-bold mb-3 text-gray-700">Primer Trimestre</h3>
                        <div class="space-y-2">
                            <div *ngFor="let exam of examenes1" 
                                class="flex justify-between items-center py-2 border-b last:border-b-0 hover:bg-gray-50 transition-colors">
                                <span class="text-sm sm:text-base text-gray-600">{{ exam.nombre }}</span>
                                <div class="flex items-center">
                                    <ng-container *ngIf="exam.completado; else notCompleted">
                                        <span class="text-green-500">
                                            <svg xmlns="http://www.w3.org/2000/svg" 
                                                class="h-5 w-5 sm:h-6 sm:w-6" 
                                                viewBox="0 0 24 24" 
                                                fill="none" 
                                                stroke="currentColor" 
                                                stroke-width="2" 
                                                stroke-linecap="round" 
                                                stroke-linejoin="round">
                                                <path d="M20 6 9 17l-5-5" />
                                            </svg>
                                        </span>
                                    </ng-container>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Segundo Trimestre -->
                    <div class="border border-slate-300 rounded-lg p-3 sm:p-4 hover:shadow-md transition-shadow">
                        <h3 class="text-base sm:text-lg lg:text-xl font-bold mb-3 text-gray-700">Segundo Trimestre</h3>
                        <div class="space-y-2">
                            <div *ngFor="let exam of examenes2" 
                                class="flex justify-between items-center py-2 border-b last:border-b-0 hover:bg-gray-50 transition-colors">
                                <span class="text-sm sm:text-base text-gray-600">{{ exam.nombre }}</span>
                                <div class="flex items-center">
                                    <ng-container *ngIf="exam.completado; else notCompleted">
                                        <span class="text-green-500">
                                            <svg xmlns="http://www.w3.org/2000/svg" 
                                                class="h-5 w-5 sm:h-6 sm:w-6" 
                                                viewBox="0 0 24 24" 
                                                fill="none" 
                                                stroke="currentColor" 
                                                stroke-width="2" 
                                                stroke-linecap="round" 
                                                stroke-linejoin="round">
                                                <path d="M20 6 9 17l-5-5" />
                                            </svg>
                                        </span>
                                    </ng-container>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tercer Trimestre -->
                    <div class="border border-slate-300 rounded-lg p-3 sm:p-4 hover:shadow-md transition-shadow">
                        <h3 class="text-base sm:text-lg lg:text-xl font-bold mb-3 text-gray-700">Tercer Trimestre</h3>
                        <div class="space-y-2">
                            <div *ngFor="let exam of examenes3" 
                                class="flex justify-between items-center py-2 border-b last:border-b-0 hover:bg-gray-50 transition-colors">
                                <span class="text-sm sm:text-base text-gray-600">{{ exam.nombre }}</span>
                                <div class="flex items-center">
                                    <ng-container *ngIf="exam.completado; else notCompleted">
                                        <span class="text-green-500">
                                            <svg xmlns="http://www.w3.org/2000/svg" 
                                                class="h-5 w-5 sm:h-6 sm:w-6" 
                                                viewBox="0 0 24 24" 
                                                fill="none" 
                                                stroke="currentColor" 
                                                stroke-width="2" 
                                                stroke-linecap="round" 
                                                stroke-linejoin="round">
                                                <path d="M20 6 9 17l-5-5" />
                                            </svg>
                                        </span>
                                    </ng-container>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Template para ícono de no completado -->
<ng-template #notCompleted>
    <span class="text-red-500">
        <svg xmlns="http://www.w3.org/2000/svg" 
            class="h-5 w-5 sm:h-6 sm:w-6" 
            viewBox="0 0 24 24" 
            fill="none" 
            stroke="currentColor" 
            stroke-width="2" 
            stroke-linecap="round" 
            stroke-linejoin="round">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
        </svg>
    </span>
</ng-template>
